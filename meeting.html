<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Brain — Meeting Mode</title>
<style>
  :root{
    --bg:#0b0908; --surf:#151110; --raised:#1e1815; --border:#332a24;
    --text:#e9ddce; --muted:#a3927f; --faint:#6a5c4f;
    --cyan:#c19a5b; --green:#5ac878; --amber:#f2b134; --red:#ef4444; --steel:#64748b;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#050403;color:var(--text);font-family:var(--sans)}
  body{display:flex;justify-content:center;padding:0}
  .phone{width:100%;max-width:412px;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* header */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#181310,#0b0908);
    border-bottom:1px solid var(--border);padding:16px 16px 12px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--faint);text-transform:uppercase}
  .h-title{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-0.3px}
  .h-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .prog{margin-top:11px;height:4px;background:var(--raised);border-radius:2px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:var(--cyan);transition:width .3s}
  .prog-label{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}

  /* list */
  main{flex:1;padding:10px 12px 120px;overflow-y:auto}
  .card{background:linear-gradient(180deg,#191411,#141010);border:1px solid var(--border);border-radius:12px;
    margin-bottom:10px;overflow:hidden;transition:border-color .2s;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .card.touched{border-color:var(--cyan)}
  .card-head{display:flex;align-items:flex-start;gap:10px;padding:13px 13px;cursor:pointer}
  .tag{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);
    border:1px solid var(--border);border-radius:5px;padding:3px 6px;background:#1a130c;white-space:nowrap;margin-top:1px}
  .ctitle{flex:1;font-size:14.5px;font-weight:600;line-height:1.32}
  .meta{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--border);margin-top:5px;flex:none}
  .dot.done{background:var(--green)} .dot.closed{background:var(--red)} .dot.carry{background:var(--amber)}
  .badge-due{color:var(--amber)}

  /* body */
  .card-body{display:none;padding:0 13px 14px;border-top:1px solid var(--border)}
  .card.open .card-body{display:block}
  .ctx{font-size:12px;color:var(--muted);font-style:italic;margin:11px 0 13px;line-height:1.4}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:6px}

  /* status segmented */
  .seg{display:flex;gap:6px;margin-bottom:15px}
  .seg button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);
    background:var(--raised);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.5px;cursor:pointer;transition:.15s}
  .seg button[data-on="done"]{background:rgba(74,222,128,.14);border-color:var(--green);color:var(--green)}
  .seg button[data-on="closed"]{background:rgba(239,68,68,.14);border-color:var(--red);color:var(--red)}
  .seg button[data-on="carry"]{background:rgba(251,191,36,.14);border-color:var(--amber);color:var(--amber)}

  /* notes */
  .note-wrap{position:relative}
  textarea{width:100%;min-height:74px;background:#120d0a;border:1px solid var(--border);border-radius:9px;
    color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;padding:11px 44px 11px 11px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--cyan)}
  .mic{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--border);background:var(--raised);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .mic.live{background:var(--cyan);color:#05080b;border-color:var(--cyan);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,154,91,.5)}50%{box-shadow:0 0 0 7px rgba(193,154,91,0)}}

  /* actions */
  .acts{margin-top:14px}
  .act-row{display:flex;gap:7px;margin-bottom:7px}
  .act-row input{flex:1;background:#120d0a;border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 10px}
  .act-row input:focus{outline:none;border-color:var(--cyan)}
  .act-row .amic{width:34px;flex:none;border:1px solid var(--border);background:var(--raised);border-radius:8px;color:var(--muted);cursor:pointer}
  .act-row .amic.live{background:var(--cyan);color:#05080b}
  .addact{width:100%;padding:9px;border-radius:8px;border:1px dashed var(--border);background:transparent;
    color:var(--cyan);font-family:var(--mono);font-size:11px;letter-spacing:.5px;cursor:pointer;margin-top:3px}

  /* new items raised */
  .newcard{border-style:dashed}
  .newcard-head{display:flex;justify-content:space-between;align-items:baseline;padding:13px;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);letter-spacing:.5px}
  .newcard-sub{font-size:9.5px;color:var(--faint);letter-spacing:.5px;font-weight:400}
  .newcard-body{padding:0 13px 14px}
  .new-row{display:flex;gap:7px;margin-bottom:7px}
  .new-row input{flex:1;background:#120d0a;border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 10px}
  .new-row input:focus{outline:none;border-color:var(--cyan)}
  .new-row .amic{width:34px;flex:none;border:1px solid var(--border);background:var(--raised);border-radius:8px;color:var(--muted);cursor:pointer}
  .new-row .amic.live{background:var(--cyan);color:#101215}
  .tgl{width:74px;flex:none;border:1px solid var(--border);background:var(--raised);border-radius:8px;
    color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer}
  .tgl.on{background:rgba(193,154,91,.16);border-color:var(--cyan);color:var(--cyan)}

  /* footer */
  .foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:30}
  .foot-inner{width:100%;max-width:412px;padding:12px;pointer-events:auto;
    background:linear-gradient(to top,var(--bg) 68%,transparent)}
  .file-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#ecdfca;color:#151110;
    font-size:15px;font-weight:700;letter-spacing:.2px;cursor:pointer;font-family:var(--sans)}
  .file-btn:disabled{background:var(--raised);color:var(--faint);cursor:default}

  /* overlay / review */
  .ovl{position:fixed;inset:0;z-index:50;background:rgba(5,8,11,.72);backdrop-filter:blur(3px);
    display:none;justify-content:center;align-items:flex-end}
  .ovl.show{display:flex}
  .sheet{width:100%;max-width:412px;max-height:92vh;background:var(--bg);border-top-left-radius:18px;
    border-top-right-radius:18px;border:1px solid var(--border);border-bottom:none;
    display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .sheet-head{padding:16px;border-bottom:1px solid var(--border)}
  .sheet-head .t{font-size:17px;font-weight:700}
  .sheet-head .s{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .sheet-body{flex:1;overflow-y:auto;padding:14px 16px}
  .rev-sec{margin-bottom:20px}
  .rev-sec h3{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--faint);
    text-transform:uppercase;margin:0 0 9px;border-bottom:1px solid var(--border);padding-bottom:6px}
  .rev-item{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:8px}
  .rev-item .rtag{font-family:var(--mono);font-size:10px;color:var(--cyan);font-weight:700}
  .rev-item .rt{font-size:13.5px;font-weight:600;margin-top:2px}
  .rev-item .rn{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
  .rev-item .rn b{color:var(--text);font-weight:600}
  .pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;
    padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
  .pill.done{background:rgba(74,222,128,.15);color:var(--green)}
  .pill.closed{background:rgba(239,68,68,.15);color:var(--red)}
  .pill.carry{background:rgba(251,191,36,.15);color:var(--amber)}
  .pill.merged{background:rgba(34,211,238,.15);color:var(--cyan)}
  .sheet-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:9px}
  .sheet-foot button{flex:1;padding:14px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);border:none}
  .btn-back{background:var(--raised);color:var(--text);border:1px solid var(--border)!important;flex:0 0 34%}
  .btn-confirm{background:var(--green);color:#05080b}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--cyan);
    border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-msg{text-align:center;padding:30px 20px;color:var(--muted);font-size:13px}
  .done-screen{text-align:center;padding:50px 24px}
  .done-screen .ck{width:60px;height:60px;border-radius:50%;background:rgba(74,222,128,.15);
    border:2px solid var(--green);color:var(--green);font-size:30px;display:flex;align-items:center;
    justify-content:center;margin:0 auto 18px}
  .staging{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--amber);text-align:center;
    padding:5px;background:rgba(251,191,36,.08);border-bottom:1px solid var(--border)}
</style>
<style>
  .picker{display:flex;gap:6px;flex-wrap:wrap;padding:12px 12px 4px}
  .picker button{flex:1;min-width:44%;padding:11px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--raised);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.4px;cursor:pointer}
  .picker button.sel{background:rgba(193,154,91,.16);border-color:var(--cyan);color:var(--cyan)}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:40px}
</style>
</head>
<body>
<div class="phone">
  <div class="staging" id="banner">MEETING MODE · LIVE · writes to the Brain</div>
  <header>
    <div class="eyebrow">WCAA · WEEKLY MEETING</div>
    <div class="h-title" id="hdept">Select a department</div>
    <div class="h-sub" id="hsub">Fri meeting</div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="prog-label"><span id="ptext">0 touched</span><span>Meeting Mode</span></div>
  </header>
  <div class="picker" id="picker"></div>
  <main id="list"><div class="loading">Pick a department to load its agenda.</div></main>
  <div class="foot"><div class="foot-inner">
    <button class="file-btn" id="fileBtn" disabled onclick="openReview()">Review &amp; File</button>
  </div></div>
</div>
<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>

<script>
var K = (new URLSearchParams(location.search)).get("k") || "";
var DEPTS = ["Environmental","Power Systems","Fleet Services","Asset Management"];
var curDept = (new URLSearchParams(location.search)).get("dept") || "";
var ITEMS = [], S = {}, NEW = [];

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog = null;
function startDictation(cb, btn){
  if(!SR){ alert("Voice dictation needs Chrome on your phone. Type for now."); return; }
  if(recog){ recog.stop(); }
  recog = new SR(); recog.lang="en-US"; recog.interimResults=true; recog.continuous=false;
  var base = cb.get(); btn.classList.add("live");
  recog.onresult=function(e){ var t=""; for(var k=0;k<e.results.length;k++) t+=e.results[k][0].transcript; cb.set((base?base+" ":"")+t); };
  recog.onend=function(){ btn.classList.remove("live"); recog=null; };
  recog.onerror=function(){ btn.classList.remove("live"); recog=null; };
  recog.start();
}

function drawPicker(){
  var p=document.getElementById("picker"); p.innerHTML="";
  DEPTS.forEach(function(d){
    var b=document.createElement("button"); b.textContent=d.toUpperCase();
    if(d===curDept) b.className="sel";
    b.onclick=function(){ curDept=d; loadDept(); };
    p.appendChild(b);
  });
}

function loadDept(){
  drawPicker();
  document.getElementById("hdept").textContent=curDept;
  document.getElementById("list").innerHTML='<div class="loading">Loading '+curDept+' agenda...</div>';
  ITEMS=[]; S={}; NEW=[];
  fetch("https://n8n.dmowbray.us/webhook/meeting-agenda?k="+encodeURIComponent(K)+"&p=WCAA").then(function(r){return r.json();}).then(function(d){
    if(!d.success){ document.getElementById("list").innerHTML='<div class="loading">Could not load ('+(d.error||"error")+').</div>'; return; }
    ITEMS = d.items.filter(function(it){ return it.dept===curDept && !it.parent; });
    ITEMS.forEach(function(i){ S[i.id]={status:null,note:"",actions:[]}; });
    document.getElementById("hsub").textContent=ITEMS.length+" items";
    render();
  }).catch(function(){ document.getElementById("list").innerHTML='<div class="loading">Network error loading agenda.</div>'; });
}

function touched(id){ var s=S[id]; return s.status||s.note.trim()||s.actions.some(function(a){return a.trim();}); }
function refresh(){
  var n=ITEMS.filter(function(i){return touched(i.id);}).length;
  var nu=NEW.filter(function(x){return x.text.trim();}).length;
  document.getElementById("pbar").style.width=(ITEMS.length?(n/ITEMS.length*100):0)+"%";
  document.getElementById("ptext").textContent=n+" of "+ITEMS.length+" touched"+(nu?" · +"+nu+" new":"");
  var total=n+nu;
  document.getElementById("fileBtn").disabled = total===0;
  document.getElementById("fileBtn").textContent = total===0 ? "Review & File" : "Review & File ("+total+")";
  var col={done:"#5ac878",closed:"#ef4444",carry:"#f2b134"};
  ITEMS.forEach(function(i){
    var c=document.getElementById("c-"+i.id); if(!c)return;
    var t=touched(i.id), st=S[i.id].status;
    c.classList.toggle("touched", !!t);
    c.style.boxShadow = st ? ("inset 3px 0 0 "+col[st]+", 0 2px 10px rgba(0,0,0,.35)") : (t ? "inset 3px 0 0 #c19a5b, 0 2px 10px rgba(0,0,0,.35)" : "0 2px 10px rgba(0,0,0,.35)");
    var d=c.querySelector(".dot"); d.className="dot"+(st?" "+st:"");
  });
}

function render(){
  var L=document.getElementById("list"); L.innerHTML="";
  if(!ITEMS.length){ L.innerHTML='<div class="loading">No open agenda items for '+curDept+'.</div>'; }
  ITEMS.forEach(function(i){
    var c=document.createElement("div"); c.className="card"; c.id="c-"+i.id;
    var head=document.createElement("div"); head.className="card-head";
    head.onclick=function(){ c.classList.toggle("open"); };
    var tag=document.createElement("div"); tag.className="tag"; tag.textContent=i.ref||"—";
    var mid=document.createElement("div"); mid.style.flex="1";
    var tt=document.createElement("div"); tt.className="ctitle"; tt.textContent=i.title;
    var metaTxt=(i.pri||"MED").toUpperCase()+" · "+(i.type||"TASK").toUpperCase();
    if(i.due) metaTxt="DUE "+i.due+" · "+metaTxt;
    var mt=document.createElement("div"); mt.className="meta"; mt.textContent=metaTxt;
    mid.appendChild(tt); mid.appendChild(mt);
    var dot=document.createElement("div"); dot.className="dot";
    head.appendChild(tag); head.appendChild(mid); head.appendChild(dot);
    c.appendChild(head);
    var body=document.createElement("div"); body.className="card-body";
    var rawnote=(i.notes||"").replace(/^raw:\s*/,"");
    if(rawnote){ var cx=document.createElement("div"); cx.className="ctx"; cx.textContent="Context: "+rawnote; body.appendChild(cx); }
    var sl=document.createElement("div"); sl.className="lbl"; sl.textContent="Status"; body.appendChild(sl);
    var seg=document.createElement("div"); seg.className="seg";
    [["done","DONE"],["closed","CLOSED"],["carry","CARRY"]].forEach(function(pair){
      var kk=pair[0], lab=pair[1];
      var b=document.createElement("button"); b.textContent=lab;
      b.onclick=function(){ S[i.id].status = S[i.id].status===kk?null:kk;
        seg.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on");});
        if(S[i.id].status) b.setAttribute("data-on",kk); refresh(); };
      seg.appendChild(b);
    });
    body.appendChild(seg);
    var nl=document.createElement("div"); nl.className="lbl"; nl.textContent="Notes"; body.appendChild(nl);
    var nw=document.createElement("div"); nw.className="note-wrap";
    var ta=document.createElement("textarea"); ta.placeholder="Type or dictate your discussion notes...";
    ta.oninput=function(){ S[i.id].note=ta.value; refresh(); };
    var mic=document.createElement("button"); mic.className="mic"; mic.innerHTML="&#127908;";
    mic.onclick=function(){ startDictation({get:function(){return ta.value;},set:function(v){ta.value=v;S[i.id].note=v;refresh();}}, mic); };
    nw.appendChild(ta); nw.appendChild(mic); body.appendChild(nw);
    var al=document.createElement("div"); al.className="acts";
    var actsBox=document.createElement("div"); al.appendChild(actsBox);
    function drawActs(){
      actsBox.innerHTML="";
      S[i.id].actions.forEach(function(v,idx){
        var r=document.createElement("div"); r.className="act-row";
        var inp=document.createElement("input"); inp.value=v; inp.placeholder="New action for this item...";
        inp.oninput=function(){ S[i.id].actions[idx]=inp.value; refresh(); };
        var am=document.createElement("button"); am.className="amic"; am.innerHTML="&#127908;";
        am.onclick=function(){ startDictation({get:function(){return inp.value;},set:function(x){inp.value=x;S[i.id].actions[idx]=x;refresh();}}, am); };
        r.appendChild(inp); r.appendChild(am); actsBox.appendChild(r);
      });
    }
    var add=document.createElement("button"); add.className="addact"; add.textContent="+ ADD ACTION";
    add.onclick=function(){ S[i.id].actions.push(""); drawActs(); };
    al.appendChild(add); body.appendChild(al); drawActs();
    c.appendChild(body); L.appendChild(c);
  });

  // new items raised
  var nc=document.createElement("div"); nc.className="card newcard";
  var nh=document.createElement("div"); nh.className="newcard-head";
  nh.innerHTML='<span>+ NEW ITEMS RAISED</span><span class="newcard-sub">brought to you this meeting</span>';
  nc.appendChild(nh);
  var nbody=document.createElement("div"); nbody.className="newcard-body";
  var nrows=document.createElement("div"); nbody.appendChild(nrows);
  function drawNew(){
    nrows.innerHTML="";
    NEW.forEach(function(it,idx){
      var r=document.createElement("div"); r.className="new-row";
      var inp=document.createElement("input"); inp.value=it.text; inp.placeholder="New task or agenda item...";
      inp.oninput=function(){ NEW[idx].text=inp.value; refresh(); };
      var am=document.createElement("button"); am.className="amic"; am.innerHTML="&#127908;";
      am.onclick=function(){ startDictation({get:function(){return inp.value;},set:function(x){inp.value=x;NEW[idx].text=x;refresh();}}, am); };
      var tg=document.createElement("button"); tg.className="tgl"+(it.onAgenda?" on":"");
      tg.textContent=it.onAgenda?"AGENDA":"TASK";
      tg.onclick=function(){ NEW[idx].onAgenda=!NEW[idx].onAgenda; drawNew(); };
      r.appendChild(inp); r.appendChild(am); r.appendChild(tg); nrows.appendChild(r);
    });
  }
  var nadd=document.createElement("button"); nadd.className="addact"; nadd.textContent="+ ADD ITEM";
  nadd.onclick=function(){ NEW.push({text:"",onAgenda:false}); drawNew(); };
  nbody.appendChild(nadd); nc.appendChild(nbody); L.appendChild(nc); drawNew();
  refresh();
}

function openReview(){
  var ovl=document.getElementById("ovl"), sheet=document.getElementById("sheet");
  ovl.classList.add("show");
  sheet.innerHTML='<div class="sheet-head"><div class="t">Reviewing your notes...</div><div class="s">Cleaning language · consolidating actions</div></div><div class="sheet-body"><div class="spinner"></div><div class="center-msg">Claude is reviewing what you entered.</div></div>';
  var payload = ITEMS.filter(function(i){return touched(i.id);}).map(function(i){
    return { ref:i.ref, id:i.id, title:i.title, status:S[i.id].status, note:S[i.id].note.trim(),
      actions:S[i.id].actions.map(function(a){return a.trim();}).filter(Boolean) };
  });
  var newItems = NEW.filter(function(x){return x.text.trim();}).map(function(x){return {text:x.text.trim(), onAgenda:x.onAgenda};});
  fetch("https://n8n.dmowbray.us/webhook/meeting-review",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({k:K,dept:curDept,items:payload,newItems:newItems})})
    .then(function(r){return r.json();})
    .then(function(out){ window._review={dept:curDept,items:payload,newItems:newItems,out:out}; renderReview(out); })
    .catch(function(){ renderReview({_fallback:true,
      notes:payload.map(function(p){return {ref:p.ref,cleaned:p.note,status:p.status};}),
      actions:[], newItems:newItems.map(function(x){return {title:x.text,onAgenda:x.onAgenda};}) }); });
}
function closeReview(){ document.getElementById("ovl").classList.remove("show"); }
function titleFor(ref){ for(var j=0;j<ITEMS.length;j++){ if(ITEMS[j].ref===ref) return ITEMS[j].title; } return ref; }

function renderReview(out){
  var sheet=document.getElementById("sheet");
  var notes=(out.notes||[]).filter(function(n){return n.cleaned||n.status;});
  var acts=(out.actions||[]);
  var news=(out.newItems||[]);
  var closures=notes.filter(function(n){return n.status==="done"||n.status==="closed";});
  var html='<div class="sheet-head"><div class="t">Confirm what gets filed</div><div class="s">'+notes.length+' notes · '+acts.length+' actions · '+news.length+' new · '+closures.length+' closing</div></div><div class="sheet-body">';
  if(out._fallback) html+='<div class="center-msg" style="color:var(--amber)">AI review unavailable — showing raw entries. You can still file.</div>';
  if(notes.length){
    html+='<div class="rev-sec"><h3>Notes → appended to existing items</h3>';
    notes.forEach(function(n){
      var st=n.status?'<span class="pill '+n.status+'">'+n.status.toUpperCase()+'</span>':'';
      html+='<div class="rev-item"><span class="rtag">'+n.ref+'</span>'+st+'<div class="rt">'+titleFor(n.ref)+'</div>'+(n.cleaned?'<div class="rn">'+n.cleaned+'</div>':'<div class="rn" style="color:var(--faint)">— status change only —</div>')+'</div>';
    });
    html+='</div>';
  }
  if(acts.length){
    html+='<div class="rev-sec"><h3>New actions → sub-tasks</h3>';
    acts.forEach(function(a){
      var mg=a.merged?'<span class="pill merged">MERGED '+((a.fromRefs||[]).join(", "))+'</span>':'';
      html+='<div class="rev-item"><div class="rt">'+a.title+mg+'</div><div class="rn">under <b>'+(a.parentRef||"—")+'</b> · '+titleFor(a.parentRef)+'</div></div>';
    });
    html+='</div>';
  }
  if(news.length){
    html+='<div class="rev-sec"><h3>New items raised → created in Work Items</h3>';
    news.forEach(function(a){
      var tp='<span class="pill '+(a.onAgenda?"carry":"merged")+'">'+(a.onAgenda?"AGENDA":"TASK")+'</span>';
      html+='<div class="rev-item"><div class="rt">'+a.title+tp+'</div></div>';
    });
    html+='</div>';
  }
  html+='</div><div class="sheet-foot"><button class="btn-back" onclick="closeReview()">Back</button><button class="btn-confirm" onclick="fileIt()">File to Brain</button></div>';
  sheet.innerHTML=html;
}

function fileIt(){
  var sheet=document.getElementById("sheet");
  sheet.innerHTML='<div class="sheet-head"><div class="t">Filing...</div></div><div class="sheet-body"><div class="spinner"></div></div>';
  var r=window._review||{};
  fetch("https://n8n.dmowbray.us/webhook/meeting-file",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({k:K,dept:r.dept,review:r.out,items:r.items,newItems:r.newItems})})
    .then(function(x){return x.json();})
    .then(function(res){
      sheet.innerHTML='<div class="done-screen"><div class="ck">&#10003;</div><div style="font-size:18px;font-weight:700">Filed to the Brain</div><div class="s" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px">'+(res.summary||"Notes appended · actions and new items created · closed items off the agenda.")+'</div><div style="margin-top:24px"><button class="file-btn" style="max-width:220px" onclick="location.reload()">Done</button></div></div>';
    })
    .catch(function(){
      sheet.innerHTML='<div class="done-screen"><div class="ck" style="color:var(--red);border-color:var(--red)">!</div><div style="font-size:16px;font-weight:700">Filing failed</div><div class="s" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px">Nothing was lost. Tap back and try again.</div><div style="margin-top:20px"><button class="file-btn" style="max-width:220px" onclick="closeReview()">Back</button></div></div>';
    });
}

drawPicker();
if(curDept && DEPTS.indexOf(curDept)>=0){ loadDept(); }
</script>
</body>
</html>
